name: Ghost Android Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Release version (for example 1.0.1 or v1.0.1)"
        required: true
        type: string
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: "9.3.1"

      - name: Resolve release version
        id: version
        shell: bash
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            raw_version="${{ inputs.version }}"
          else
            raw_version="${GITHUB_REF_NAME}"
          fi

          version="${raw_version#v}"
          base_version="${version%%-*}"

          if [[ ! "$base_version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Invalid version: $version. Expected MAJOR.MINOR.PATCH."
            exit 1
          fi

          IFS='.' read -r major minor patch <<< "$base_version"
          version_code=$((major * 1000000 + minor * 1000 + patch))

          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "version_code=$version_code" >> "$GITHUB_OUTPUT"
          echo "Building Ghost $version (versionCode $version_code)"

      - name: Prepare signing keystore
        env:
          RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
        run: |
          if [[ -z "$RELEASE_KEYSTORE_BASE64" ]]; then
            echo "Missing RELEASE_KEYSTORE_BASE64 repository secret."
            echo "Add the same upload keystore used by existing Ghost releases before publishing an update."
            exit 1
          fi

          echo "$RELEASE_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/release.keystore"
          test -s "$RUNNER_TEMP/release.keystore"

      - name: Build signed release APK
        env:
          RELEASE_VERSION: ${{ steps.version.outputs.version }}
          RELEASE_VERSION_CODE: ${{ steps.version.outputs.version_code }}
          KEYSTORE_PATH: ${{ runner.temp }}/release.keystore
          STORE_PASSWORD: ${{ secrets.RELEASE_STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: |
          if [[ -z "$STORE_PASSWORD" || -z "$KEY_PASSWORD" ]]; then
            echo "Missing RELEASE_STORE_PASSWORD or RELEASE_KEY_PASSWORD repository secret."
            exit 1
          fi

          gradle :app:assembleRelease --stacktrace

      - name: Rename APK
        shell: bash
        run: |
          apk="app/build/outputs/apk/release/app-release.apk"
          test -f "$apk"
          cp "$apk" "Ghost-v${{ steps.version.outputs.version }}.apk"

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: v${{ steps.version.outputs.version }}
          name: Ghost v${{ steps.version.outputs.version }}
          target_commitish: main
          generate_release_notes: true
          files: Ghost-v${{ steps.version.outputs.version }}.apk
